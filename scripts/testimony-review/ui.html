<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testimony Curation Console (temporary)</title>
<style>
  :root {
    --bg: #16130f; --panel: #201c16; --panel2: #2a251d; --line: #3a332a;
    --ink: #e8e2d6; --dim: #a89f8d; --accent: #d3b476;
    --pub: #7fbf7f; --que: #d9b45c; --rem: #e07a6a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); }
  header .note { color: var(--dim); font-size: 12px; }
  #tally { margin-left: auto; font-size: 13px; color: var(--dim); }
  #tally b { color: var(--ink); }
  main { display: grid; grid-template-columns: minmax(420px, 44%) 1fr; height: calc(100vh - 49px); }
  #list { overflow-y: auto; border-right: 1px solid var(--line); padding: 12px; }
  #reader { overflow-y: auto; padding: 20px 28px; }
  .set { margin-bottom: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .set-head { padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  .set-head h2 { font-size: 14px; margin: 0; flex: 1; }
  .set-head .counts { color: var(--dim); font-size: 12px; }
  .bulk { display: flex; gap: 6px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:hover, .row.open { background: var(--panel2); }
  .row .meta { flex: 1; min-width: 0; }
  .row .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .d { display: block; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); flex: none; }
  .badge.published { color: var(--pub); border-color: var(--pub); }
  .badge.queued { color: var(--que); border-color: var(--que); }
  .badge.inbox { color: #7fb3d9; border-color: #7fb3d9; }
  .warn { color: var(--rem); font-size: 11px; }
  button { font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 5px; border: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; flex: none; }
  button:hover { border-color: var(--dim); color: var(--ink); }
  button.on-publish { background: var(--pub); border-color: var(--pub); color: #10240f; }
  button.on-queue { background: var(--que); border-color: var(--que); color: #2b2308; }
  button.on-remove { background: var(--rem); border-color: var(--rem); color: #2d0e08; }
  #reader .placeholder { color: var(--dim); margin-top: 40vh; text-align: center; }
  #reader h1, #reader h2, #reader h3 { color: var(--accent); line-height: 1.25; }
  #reader img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; }
  #reader pre { background: var(--panel); padding: 10px; border-radius: 6px; overflow-x: auto; }
  #reader code { background: var(--panel); padding: 1px 4px; border-radius: 3px; }
  #reader blockquote { border-left: 3px solid var(--accent); margin-left: 0; padding-left: 14px; color: var(--dim); }
  #reader .filehead { color: var(--dim); font-size: 12px; border-top: 1px dashed var(--line); margin-top: 28px; padding-top: 10px; }
  #reader embed { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>Testimony curation</h1>
  <span class="note">temporary local tool &middot; decisions save instantly &middot; nothing changes on disk until <code>testimonies:apply --execute</code></span>
  <span id="tally"></span>
</header>
<main>
  <div id="list"></div>
  <div id="reader"><div class="placeholder">Select a testimony to read it</div></div>
</main>
<script>
let STATE = { sets: {}, decisions: {}, primaries: {} };
let OPEN_KEY = null;

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// Minimal markdown renderer — enough for testimony prose (headings, emphasis,
// lists, code, quotes, links). Not a full spec implementation; this is a
// disposable reading aid, the site itself uses react-markdown.
function md(src) {
  const lines = src.split('\n');
  let html = '', inCode = false, inList = false, inQuote = false, para = [];
  const inline = (s) => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  const flushPara = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const flushList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const flushQuote = () => { if (inQuote) { html += '</blockquote>'; inQuote = false; } };
  for (const raw of lines) {
    if (raw.trim().startsWith('```')) {
      flushPara(); flushList(); flushQuote();
      html += inCode ? '</pre>' : '<pre>'; inCode = !inCode; continue;
    }
    if (inCode) { html += esc(raw) + '\n'; continue; }
    const line = raw.trimEnd();
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushPara(); flushList(); flushQuote(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      flushPara(); flushQuote();
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + inline(line.replace(/^\s*([-*+]|\d+\.)\s+/, '')) + '</li>'; continue;
    }
    if (/^>\s?/.test(line)) {
      flushPara(); flushList();
      if (!inQuote) { html += '<blockquote>'; inQuote = true; }
      html += inline(line.replace(/^>\s?/, '')) + '<br>'; continue;
    }
    if (/^(---|\*\*\*|___)\s*$/.test(line)) { flushPara(); flushList(); flushQuote(); html += '<hr>'; continue; }
    if (!line.trim()) { flushPara(); flushList(); flushQuote(); continue; }
    para.push(line.trim());
  }
  flushPara(); flushList(); flushQuote();
  if (inCode) html += '</pre>';
  return html;
}

async function decide(key, decision) {
  const current = STATE.decisions[key];
  const next = current === decision ? null : decision; // click again to clear
  const r = await fetch('/api/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, decision: next }),
  });
  const out = await r.json();
  STATE.decisions = out.decisions; STATE.primaries = out.primaries || STATE.primaries;
  renderList();
}

async function setPrimary(key, loc, relpath) {
  const next = STATE.primaries[key] === relpath ? null : relpath; // click again to clear
  const r = await fetch('/api/primary', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, loc, relpath: next }),
  });
  const out = await r.json();
  if (out.error) { alert(out.error); return; }
  STATE.primaries = out.primaries;
  renderList();
  openReader(key, loc);
}

function allTestimonies(set) { return [...set.published, ...set.queued, ...(set.inbox || [])]; }

async function bulk(baseSet, decision) {
  for (const t of allTestimonies(STATE.sets[baseSet])) {
    if (STATE.decisions[t.key] !== decision) {
      await fetch('/api/decide', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: t.key, decision }),
      }).then(async (r) => { STATE.decisions = (await r.json()).decisions; });
    }
  }
  renderList();
}

function tally() {
  const counts = { publish: 0, queue: 0, remove: 0, undecided: 0 };
  for (const set of Object.values(STATE.sets)) {
    for (const t of allTestimonies(set)) {
      const d = STATE.decisions[t.key];
      if (d) counts[d]++; else counts.undecided++;
    }
  }
  document.getElementById('tally').innerHTML =
    `publish <b>${counts.publish}</b> &middot; queue/hold <b>${counts.queue}</b> &middot; ` +
    `remove <b>${counts.remove}</b> &middot; undecided <b>${counts.undecided}</b>`;
}

function renderList() {
  const el = document.getElementById('list');
  const names = Object.keys(STATE.sets).sort();
  el.innerHTML = names.map((name) => {
    const set = STATE.sets[name];
    const rows = allTestimonies(set)
      .sort((a, b) => a.dirname.localeCompare(b.dirname))
      .map((t) => {
        const d = STATE.decisions[t.key];
        let warn = t.unreachableImages.length
          ? `<span class="warn" title="${esc(t.unreachableImages.join(', '))}">&#9888; ${t.unreachableImages.length} img in non-standard dir</span>`
          : '';
        if (t.hasRootMd === false) {
          warn += STATE.primaries[t.key]
            ? ' <span class="warn" style="color:var(--pub)">primary &#10003;</span>'
            : ' <span class="warn">&#9888; no top-level md — pick primary in reader</span>';
        }
        const holdLabel = t.location === 'inbox' ? 'hold' : 'queue';
        return `<div class="row ${OPEN_KEY === t.key ? 'open' : ''}" data-key="${esc(t.key)}" data-loc="${t.location}">
          <div class="meta" onclick="openReader('${esc(t.key)}','${t.location}')">
            <span class="t">${esc(t.title)}</span>
            <span class="d">${esc(t.dirname)} &middot; ${t.mdFiles.length} md &middot; ${t.imageCount} img ${warn}</span>
          </div>
          <span class="badge ${t.location}">${t.location}</span>
          <button class="${d === 'publish' ? 'on-publish' : ''}" onclick="decide('${esc(t.key)}','publish')">publish</button>
          <button class="${d === 'queue' ? 'on-queue' : ''}" onclick="decide('${esc(t.key)}','queue')">${holdLabel}</button>
          <button class="${d === 'remove' ? 'on-remove' : ''}" onclick="decide('${esc(t.key)}','remove')">remove</button>
        </div>`;
      }).join('');
    const inboxCount = (set.inbox || []).length;
    return `<div class="set">
      <div class="set-head">
        <h2>${esc(name)}</h2>
        <span class="counts">${set.published.length} published &middot; ${set.queued.length} queued${inboxCount ? ` &middot; ${inboxCount} inbox` : ''}</span>
        <span class="bulk">
          <button onclick="bulk('${esc(name)}','publish')">all publish</button>
          <button onclick="bulk('${esc(name)}','queue')">all ${inboxCount && !set.published.length && !set.queued.length ? 'hold' : 'queue'}</button>
        </span>
      </div>
      ${rows}
    </div>`;
  }).join('');
  tally();
}

async function openReader(key, loc) {
  OPEN_KEY = key;
  renderList();
  const set = Object.values(STATE.sets).find((s) => allTestimonies(s).some((t) => t.key === key));
  const t = allTestimonies(set).find((x) => x.key === key);
  const reader = document.getElementById('reader');
  reader.innerHTML = `<h1>${esc(t.title)}</h1><p class="filehead">${esc(t.baseSet)} / ${esc(t.dirname)} (${t.location})</p>`;
  const docUrl = (f) => `/api/doc?key=${encodeURIComponent(key)}&loc=${loc}&f=${encodeURIComponent(f)}`;
  for (const f of t.files) {
    if (f.endsWith('.md')) {
      const text = await (await fetch(docUrl(f))).text();
      let head = esc(f);
      if (t.hasRootMd === false) {
        const isPrimary = STATE.primaries[key] === f;
        head += ` <button class="${isPrimary ? 'on-publish' : ''}" onclick="setPrimary('${esc(key)}','${loc}','${esc(f)}')">${isPrimary ? 'primary &#10003;' : 'set primary'}</button>`;
      }
      reader.innerHTML += `<div class="filehead">${head}</div>` + md(text);
    } else if (/\.(png|jpg|jpeg|gif|webp|svg)$/i.test(f)) {
      reader.innerHTML += `<div class="filehead">${esc(f)}</div><img loading="lazy" src="${docUrl(f)}">`;
    } else if (f.endsWith('.pdf')) {
      reader.innerHTML += `<div class="filehead">${esc(f)}</div><embed src="${docUrl(f)}" type="application/pdf">`;
    } else {
      reader.innerHTML += `<div class="filehead">${esc(f)} (not previewed)</div>`;
    }
  }
  reader.scrollTop = 0;
}

fetch('/api/state').then((r) => r.json()).then((s) => { STATE = s; renderList(); });
</script>
</body>
</html>
