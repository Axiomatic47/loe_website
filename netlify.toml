# netlify.toml — source of truth for build, redirects, and headers.
# Headers live HERE (public/_headers stays removed — do not recreate).
# Redirect layers, in evaluation order:
#   1. public/_redirects — GENERATED frozen legacy 301s (freeze-legacy-urls.mjs;
#      686 forced rules; cited in filed legal documents — the backstop layer)
#   2. this file's domain-level 301s
#   3. next.config.ts compiled redirects (same frozen map + 2,098 generated)
#
# CUTOVER (2026-07-21): builds the Next.js App Router site via
# @netlify/plugin-nextjs. The old vite build ("npm run build") still works
# on this branch until the vite side is deleted.

[build]
  command = "npm run build:next"
  # Required by @netlify/plugin-nextjs v5 — must be the Next build output
  # dir. Also pins the value so no stale dashboard publish setting (the old
  # vite "dist") can leak through.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers.
# CSP notes: 'unsafe-inline'/'unsafe-eval' remain for the inline theme/MathJax/
# plausible bootstraps and MathJax's eval (tightening tracked for the framework
# migration). jsdelivr = MathJax. identity.netlify.com and cdnjs removed with
# the CMS stack (2026-07); unpkg + map tile hosts removed with the worldmap
# realm (D4 retirement, 2026-07).
[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.paypal.com https://*.paypal.com https://www.paypalobjects.com https://*.paypalobjects.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.paypal.com https://*.paypalobjects.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https: https://*.paypal.com https://*.paypalobjects.com https://img.youtube.com https://i.ytimg.com; connect-src 'self' https://*.paypal.com https://api.sandbox.paypal.com https://plausible.io https://cdn.jsdelivr.net; frame-src 'self' https://*.paypal.com https://www.paypal.com https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self';"

# Immutable long-cache for content-hashed build assets (Next emits /_next/static)
[[headers]]
  for = "/_next/static/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Filed exhibits / media: content never changes once published
[[headers]]
  for = "/uploads/*"
    [headers.values]
    Cache-Control = "public, max-age=604800"

# Unlisted research archives: server-enforced noindex (pages AND raw files)
[[headers]]
  for = "/research/*"
    [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/uploads/research/*"
    [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=86400"

# Development server configuration (Next dev; the vite server is still
# available directly via `npm run dev` until the vite side is deleted)
[dev]
  framework = "#custom"
  command = "npx next dev"
  targetPort = 3000  # next dev default port
  port = 8888
  autoLaunch = false

# Force HTTPS redirect for the new domain
[[redirects]]
  from = "http://lawsofexistence.com/*"
  to = "https://lawsofexistence.com/:splat"
  status = 301
  force = true

# NOTE: www redirects are handled by Netlify dashboard domain settings
# Do not add conflicting redirects here

# Redirect old domain names to new domain (if applicable)
[[redirects]]
  from = "https://lawofsupremacism.com/*"
  to = "https://lawsofexistence.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lawofsupremacism.com/*"
  to = "https://lawsofexistence.com/:splat"
  status = 301
  force = true

# Redirect .ai domain (alias) to primary .com domain
[[redirects]]
  from = "https://lawsofexistence.ai/*"
  to = "https://lawsofexistence.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lawsofexistence.ai/*"
  to = "https://lawsofexistence.com/:splat"
  status = 301
  force = true

# Redirect Netlify subdomain to primary domain
[[redirects]]
  from = "https://lawofexistence.netlify.app/*"
  to = "https://lawsofexistence.com/:splat"
  status = 301
  force = true
