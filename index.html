<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Laws of Existence - A Unified Mathematical Framework</title>

    <!-- Theme bootstrap: applies dark/light class before paint to prevent FOUC -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('loe-theme');
          var theme = stored || 'light';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <!-- SEO Meta Tags -->
    <meta name="description" content="A unified mathematical framework for consciousness, ethics, and reality by Joseph Kirchner" />
    <meta name="keywords" content="consciousness, mathematical framework, ethics, philosophy, unified theory, AI alignment" />
    <meta name="author" content="Joseph Kirchner" />

    <!-- Open Graph Tags -->
    <meta property="og:title" content="The Laws of Existence" />
    <meta property="og:description" content="A unified mathematical framework for consciousness, ethics, and reality" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lawsofexistence.com" />
    <meta property="og:image" content="https://lawsofexistence.com/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- MathJax loads ON DEMAND from src/utils/mathjax.ts (config + macros
         moved there verbatim) — only pages whose content contains TeX pay
         for the ~1 MB bundle. -->

    <!-- Plausible Analytics - Privacy-focused, GDPR compliant with enhanced features -->
    <script defer data-domain="lawsofexistence.com" src="https://plausible.io/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script>
    <script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>

    <!-- Formal Logic and Math Styles -->
    <style>
      /* Mathematical expression styling */
      .math-display {
        margin: 1.5em 0;
        text-align: center;
        overflow-x: auto;
      }

      .math-inline {
        margin: 0 0.2em;
      }

      /* Formal logic expressions */
      .logic-expression {
        font-family: 'Noto Serif', serif !important;
        background: hsl(var(--secondary)) !important;
        border-left: 3px solid hsl(var(--primary)) !important;
        border-radius: 8px !important;
        padding: 1em 1.5em !important;
        margin: 1.5em 0 !important;
        color: hsl(var(--foreground)) !important;
        overflow-x: auto;
      }

      .logic-expression.inline {
        display: inline-block !important;
        padding: 0.2em 0.5em !important;
        margin: 0 0.3em !important;
        background: hsl(var(--muted)) !important;
        border: 1px solid hsl(var(--border)) !important;
        border-radius: 4px !important;
        color: hsl(var(--foreground)) !important;
      }

      /* MathJax styling improvements */
      .MathJax {
        font-size: 1.1em !important;
      }

      .MathJax_Display {
        margin: 1.5em 0 !important;
      }

      /* Responsive mathematical content */
      @media (max-width: 768px) {
        .logic-expression {
          font-size: 0.9em;
          padding: 0.8em 1em;
          overflow-x: auto;
        }

        .MathJax {
          font-size: 1em !important;
        }
      }

      /* Loading state for math */
      .math-loading {
        background: hsl(var(--muted));
        border-radius: 4px;
        padding: 0.5em;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
